# scripts/check.sh on both OSes: a Platform method implemented for one OS
# only fails here. The first build downloads the ONNX Runtime (network).
name: ci
on: [push, pull_request]
# it only reads the code: no token that can write
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # a fixed image, not macos-latest: a new macOS changes nothing unannounced
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # no debug info, no incremental: the Ubuntu runner's disk filled up with them
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # the packages of docker/Dockerfile.linux, bar lld (a runner has the memory)
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libssl-dev libgtk-3-dev libasound2-dev libxkbcommon-dev xkb-data
      # dependencies only, pruned of stale builds before saving: a whole `target`
      # restored and rebuilt per Cargo.lock grew 1.1 → 2.6 GB packed until unpacking
      # it filled the Ubuntu runner's disk
      - uses: Swatinem/rust-cache@v2
      # the ONNX Runtime the `ort` crate downloads at build time
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
          key: ${{ matrix.os }}-ort-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-ort-
      # the UI tests' frames (UI_SHOTS), kept when a run fails, to see what it drew
      - run: mkdir -p "$UI_SHOTS" && scripts/check.sh
        env:
          UI_SHOTS: ${{ runner.temp }}/ui-shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-shots-${{ matrix.os }}
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
