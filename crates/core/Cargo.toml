[package]
name = "blitznir-core"
description = "All of Blitznir's logic, headless and tested: no UI, OS or model code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { workspace = true, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync"] }
toml = "0.9"
# the Settings form edits config.toml in place, comments kept; already in the tree (proc-macro-crate)
toml_edit = "0.25"
# characters as the eye sees them, for Backspace counts; already in the tree
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# the runtime comes from the app; tests bring their own
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
